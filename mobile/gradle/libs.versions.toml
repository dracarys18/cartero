[versions]
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
composeMultiplatform = "1.13.0-alpha01"
material3 = "1.13.0-alpha01"
adaptive = "1.3.0-rc01"
navigation3 = "1.2.0-beta01"
lifecycle = "2.11.0"
activity = "1.13.0"
room = "3.0.3"
sqlite = "2.7.1"
paging = "3.5.1"
datastore = "1.2.1"
browser = "1.10.0"
profileinstaller = "1.4.1"
ktor = "3.6.0"
coil = "3.6.3"
ksoup = "0.2.6"
serialization = "1.11.0"
coroutines = "1.11.0"
datetime = "0.8.0"
benchmark = "1.5.0"
uiautomator = "2.4.0"
junitExt = "1.3.0"
iroh = "1.1.0"
qrose = "1.3.0"
zxing = "4.3.0"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
compose-material3-navigation-suite = { module = "org.jetbrains.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3" }
adaptive-navigation3 = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "adaptive" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
